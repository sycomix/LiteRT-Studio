name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,api]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m compileall -q src
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - uses: actions/upload-artifact@v7
        with:
          name: litert-studio-wheel
          path: dist/*.whl
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - working-directory: android/reference-app
        run: gradle --no-daemon lintDebug assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: litert-studio-android-debug
          path: android/reference-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
