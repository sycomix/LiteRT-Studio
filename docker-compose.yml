version: "3.9"

# ---------------------------------------------------------------------------
# LiteRT Studio — Docker Compose configurations
#
# Usage:
#   docker compose up                   # development (GPU-aware)
#   docker compose up --build           # build and start
# ---------------------------------------------------------------------------

services:
  litert-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litert-studio
    runtime: nvidia                   # NVIDIA GPU runtime required for CUDA
    ports:
      - "${PORT:-7860}:7860"
    volumes:
      # Mount workspace for live code + data sync
      - ./workspace:/app/workspace:delegated
      # Source overlay for hot reload during development
      - ./:/src/litert_studio_source:ro,z
    environment:
      - PYTHONPATH=/src/litert_studio_source
      - PORT=7860
      - WORKSPACE_DIR=/app/workspace
      # Optional: Hugging Face credentials for model downloads
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # -----------------------------------------------------------------------
  # GPU-enabled training worker — inherits NVIDIA runtime from parent service
  # -----------------------------------------------------------------------
  training-worker:
    extends: litert-studio
    image: litert-studio:${TAG:-latest}
    container_name: litert-studio-training
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-0}
    volumes:
      - ./workspace:/app/workspace:delegated
      - ./models:/app/models:ro,z        # cached models volume
      - ./datasets:/app/datasets:rw,z     # dataset storage
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Named volumes for persistent data
# ---------------------------------------------------------------------------
volumes:
  litert-workspace:
    name: litert-studio-workspace
    driver: local
